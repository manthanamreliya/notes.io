services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: notes-io-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    networks:
      - notes-network
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    container_name: notes-io-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - notes-network
    restart: unless-stopped

networks:
  notes-network:
    driver: bridge
